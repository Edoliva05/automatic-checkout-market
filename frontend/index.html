<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cassa Automatica</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="main-container">
        
        <div id="header">
            <h1>Automatic Checkout</h1>
        </div>

        <div id="reader">

        </div>

        <div id="monitor">
            <button id="btn-new-cart">Start new cart</button>

            <div class="manual-entry">
                <label for="input-barcode">Manual insert:</label>
                <input id="input-barcode" type="text" placeholder="Es. 800456" />
                <button id="btn-send-scan">Scan</button>
            </div>

            <button id="btn-checkout">Checkout</button>
        </div>

        <div id="cart">
            <h2>Receipt</h2>
            <ul id="cart-items">
                <!-- Scanned products -->
            </ul>
            <div id="cart-total">Total to Pay: €0.0</div>
        </div>

    </div>

    <div id="error-div">
        
    </div>


    <script src="lib/scanner.js"></script>
    <script src="lib/axios.js"></script>
    <script src="script.js"></script>
</body>


</html>
